# Compila la app Android (analisis/frontend, Capacitor) y deja el APK como artefacto descargable:
# pestaña Actions → la ejecución → "AnalisisInversiones-android".
#
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD, se compila la versión "release" firmada siempre con la misma clave (las actualizaciones se
# instalan encima sin perder datos). Sin ellos, se compila un APK de depuración: sirve para probar, pero cada
# compilación tiene otra firma y para actualizar hay que desinstalar.
name: App de análisis · Android

on:
  push:
    paths: ['analisis/frontend/**', '.github/workflows/analisis-android.yml']
  pull_request:
    paths: ['analisis/frontend/**', '.github/workflows/analisis-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analisis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: analisis/frontend
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analisis/frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dependencias y tests (incluye la paridad con el motor de Python)
        run: |
          npm ci
          npm test

      - name: Compilar el dashboard en modo móvil y copiarlo al proyecto Android
        run: npm run android:sync

      - name: Clave de firma (si está configurada)
        id: firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin clave de firma: se compila un APK de depuración. Para actualizar sin desinstalar, configura los secretos ANDROID_* (ver analisis/README.md)."
          fi

      - name: Compilar el APK
        working-directory: analisis/frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.firma.outputs.tipo }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AnalisisInversiones.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/AnalisisInversiones.apk"
          fi
          ls -l "$RUNNER_TEMP/AnalisisInversiones.apk"
          {
            echo "### APK ${{ steps.firma.outputs.tipo }} · versión 1.0.${{ github.run_number }}"
            echo "Tamaño: $(du -h "$RUNNER_TEMP/AnalisisInversiones.apk" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AnalisisInversiones-android
          path: ${{ runner.temp }}/AnalisisInversiones.apk
          retention-days: 30
